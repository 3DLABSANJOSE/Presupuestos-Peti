<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuesto - Peti Polarizados</title>
    <!-- Librería para generar PDF directo para compartir -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f4f6f9;
            color: #333333;
            padding: 10px;
        }

        .container {
            max-width: 800px;
            background: #ffffff;
            margin: 0 auto;
            padding: 30px 30px 25px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            position: relative;
            border: 1px solid #e1e4e8;
            overflow: hidden;
            min-height: 1050px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .watermark {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 520px;
            height: auto;
            opacity: 0.08;
            z-index: 0;
            pointer-events: none;
            object-fit: contain;
        }

        .top-action-bar, .header, .meta-info, .table-responsive, .btn-add, .bottom-section, .notes-section, .footer, .bottom-action-bar {
            position: relative;
            z-index: 1;
        }

        .top-action-bar {
            text-align: right;
            margin-bottom: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #1a252f;
            padding-bottom: 22px;
            margin-bottom: 22px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .logo {
            width: 85px;
            height: 85px;
            object-fit: contain;
            background-color: transparent;
        }

        .brand-info h1 {
            font-size: 24px;
            font-weight: 900;
            color: #1a252f;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .brand-info p {
            font-size: 10.5px;
            font-weight: 600;
            color: #555555;
            margin-top: 3px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            line-height: 1.35;
        }

        .invoice-details {
            text-align: right;
        }

        .invoice-type {
            display: inline-block;
            border: 2px solid #1a252f;
            color: #1a252f;
            padding: 5px 14px;
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 4px;
        }

        .invoice-number-box {
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        .invoice-number-box span {
            font-weight: 800;
            color: #e74c3c;
            cursor: pointer;
            border-bottom: 1px dashed #e74c3c;
            padding: 0 4px;
        }

        .invoice-number-box span:hover {
            background-color: #fde8e7;
        }

        .meta-info {
            display: grid;
            grid-template-columns: 2fr 1fr 1.5fr 1fr;
            gap: 12px;
            margin-bottom: 22px;
            font-size: 13px;
            background: #f8f9fa;
            padding: 18px;
            border-radius: 6px;
            border: 1px solid #e1e4e8;
        }

        .meta-info div {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .meta-info strong {
            color: #1a252f;
            font-size: 11px;
            text-transform: uppercase;
        }

        .meta-info input {
            border: 1px solid #ced4da;
            background: #ffffff;
            padding: 9px;
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            color: #333;
            width: 100% !important;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th, td {
            border: 1px solid #dee2e6;
            padding: 12px 10px;
            text-align: left;
            font-size: 13px;
            vertical-align: middle;
        }

        th {
            background-color: #1a252f;
            color: #ffffff;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
        }

        td input {
            width: 100%;
            border: 1px solid #ced4da;
            background: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            outline: none;
            color: #333;
            padding: 8px;
            border-radius: 4px;
        }

        .editable-desc {
            width: 100%;
            min-height: 34px;
            outline: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            color: #333;
            word-break: break-word;
            white-space: pre-wrap;
            background: #ffffff;
            border: 1px solid #ced4da;
            padding: 8px;
            border-radius: 4px;
        }

        .editable-desc:focus, .editable-notes:focus, td input:focus {
            background: #fff;
            border-color: #1a252f;
        }

        .col-cant { width: 12%; text-align: center; }
        .col-desc { width: 43%; }
        .col-precio { width: 18%; text-align: right; }
        .col-sub { width: 18%; text-align: right; font-weight: 600; }
        .col-accion { width: 9%; text-align: center; }

        .btn-add, .btn-delete {
            background: #27ae60;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: background 0.2s;
        }

        .btn-delete {
            background: #c0392b;
            padding: 7px 10px;
        }

        .btn-add:hover { background: #219653; }
        .btn-delete:hover { background: #962d22; }

        .bottom-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 22px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .validity-box {
            flex: 1;
            min-width: 250px;
            font-size: 13px;
            color: #555;
            background: #f8f9fa;
            border: 1px solid #e1e4e8;
            padding: 15px;
            border-radius: 6px;
            line-height: 1.5;
        }

        .validity-box strong {
            color: #1a252f;
        }

        .totals-box {
            width: 100%;
            max-width: 320px;
            border: 1px solid #e1e4e8;
            background: #f8f9fa;
            border-radius: 6px;
            padding: 15px;
            margin-left: auto;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }

        .total-row.final {
            border-top: 2px solid #1a252f;
            margin-top: 8px;
            padding-top: 12px;
            font-size: 16px;
            font-weight: 900;
            color: #1a252f;
        }

        .notes-section {
            margin-bottom: 22px;
            background: #f8f9fa;
            border: 1px solid #e1e4e8;
            padding: 15px;
            border-radius: 6px;
        }

        .notes-section label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #1a252f;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .editable-notes {
            width: 100%;
            min-height: 80px;
            outline: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            color: #333;
            word-break: break-word;
            white-space: pre-wrap;
            background: #ffffff;
            border: 1px solid #ced4da;
            padding: 10px;
            border-radius: 4px;
            line-height: 1.5;
        }

        .footer {
            border-top: 1px solid #e1e4e8;
            padding-top: 18px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 12px;
            color: #666;
            gap: 15px;
            flex-wrap: wrap;
        }

        .footer-left {
            line-height: 1.6;
        }
